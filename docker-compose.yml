services:
  backend:
    build: ./backend
    env_file:
      - path: ./backend/.env
        required: false
    ports:
      - "8000:8000"
    environment:
      DJANGO_DEBUG: "True"
      DJANGO_SECRET_KEY: local-development-only-secret
      DATABASE_URL: sqlite:////app/data/db.sqlite3
    volumes:
      - backend_data:/app/data
      - backend_media:/app/media
volumes:
  backend_data:
  backend_media:
